name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    defaults:
      run:
        working-directory: Sequoia
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Package tests (growth engine, words, practice, design system)
        working-directory: Sequoia/Packages/SequoiaKit
        run: xcodebuild test -scheme SequoiaKit-Package -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO

      - name: Build iPhone app (Debug, with dev mode)
        run: xcodebuild build -project Sequoia.xcodeproj -scheme Sequoia -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

      - name: Build iPhone app (Release)
        run: xcodebuild build -project Sequoia.xcodeproj -scheme Sequoia -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

      - name: Build watch app
        run: xcodebuild build -project Sequoia.xcodeproj -scheme SequoiaWatch -configuration Debug -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO
